{% extends "base.html" %}
{% block page_name %}login{% endblock %}
{% block content %}
<section class="login-card">
  <div class="login-heading">
    <span class="brand-mark large">DL</span>
    <h1>Digital Library</h1>
    <p class="creator-name">by ToucheCodes</p>
    <p>Book Lending and Management System</p>
  </div>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" class="stack-form">
    <label>Username<input name="username" value="admin" required></label>
    <label>Password<input type="password" name="password" value="admin123" required></label>
    <button class="button primary" type="submit">Sign in</button>
  </form>
  <p class="hint">Demonstration account: admin / admin123</p>
</section>
{% endblock %}
